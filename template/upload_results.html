<!doctype html><html lang="en"{{if and .User .User.DarkMode}} data-bs-theme="dark"{{end}}><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Upload complete · {{(branding).SiteName}}</title>{{template "tabler-head" .}}</head><body><div class="page">{{if .User}}{{template "app-nav" .}}{{end}}<div class="page-wrapper"><div class="page-header"><div class="container-xl"><div class="page-pretitle">Upload complete</div><h2 class="page-title">{{len .Files}} files uploaded</h2></div></div><div class="page-body"><div class="container-xl"><div class="card"><div class="list-group list-group-flush">{{range .Files}}<a class="list-group-item list-group-item-action" href="/file/{{.ID}}"><div class="d-flex align-items-center"><div class="flex-fill"><strong>{{.Name}}</strong><div class="text-secondary small">Open details and sharing options</div></div><span class="btn btn-sm">Open</span></div></a>{{end}}</div><div class="card-footer text-end"><a class="btn btn-primary" href="/">Upload more</a></div></div></div></div>{{template "footer" .}}</div></div></body></html>
