<!doctype html>
<html lang="en"{{if and .User .User.DarkMode}} data-bs-theme="dark"{{end}}>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OAuth login · {{(branding).SiteName}}</title>{{template "tabler-head" .}}
</head>
<body class="d-flex flex-column">
  <div class="page page-center"><div class="container container-tight py-4">
    <div class="text-center mb-4"><a href="/" class="navbar-brand navbar-brand-autodark justify-content-center">{{template "brand" .}}</a></div>
    <div class="card card-md"><div class="card-body text-center">
      <h2 class="h2 mb-4">OAuth login could not be completed</h2>
      <div class="alert alert-danger text-start" role="alert">{{.Error}}</div>
      <a class="btn btn-primary w-100" href="{{.Back}}">{{.BackLabel}}</a>
    </div></div>
  </div></div>
  {{template "footer" .}}
</body>
</html>
