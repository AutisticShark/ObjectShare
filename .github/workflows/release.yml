name: Test and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "template/**"
      - "README.md"
      - "LICENSE"
      - "config.json.example"
      - ".github/workflows/*.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "template/**"
      - "README.md"
      - "LICENSE"
      - "config.json.example"
      - ".github/workflows/*.yml"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: binary-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goamd64: v1
            asset: linux-amd64
          - goos: linux
            goarch: amd64
            goamd64: v3
            asset: linux-amd64v3
          - goos: linux
            goarch: arm64
            goamd64: v1
            asset: linux-arm64
          - goos: linux
            goarch: riscv64
            goamd64: v1
            asset: linux-riscv64
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOAMD64: ${{ matrix.goamd64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Select binary version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            version="$RELEASE_TAG"
          else
            version="dev-${COMMIT_SHA:0:12}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Build and package binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p package dist
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid= -X github.com/AutisticShark/ObjectShare/config.Version=$VERSION" \
            -o package/object-share ./
          cp README.md LICENSE config.json.example package/
          touch -t 198001010000 package/*
          archive="object-share-${ASSET}.zip"
          (
            cd package
            zip -9 -X "../dist/${archive}" ./*
          )
          (
            cd dist
            sha256sum "$archive" > "${archive}.sha256"
            openssl dgst -sha3-256 "$archive" > "${archive}.sha3-256"
          )
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: object-share-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Attach binaries to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: object-share-*
          path: release-assets
          merge-multiple: true
      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
