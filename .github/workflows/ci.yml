name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:19.0-alpine3.24@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
        env:
          POSTGRES_USER: objectshare
          POSTGRES_PASSWORD: objectshare-ci-only
          POSTGRES_DB: objectshare_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U objectshare -d objectshare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build
      - name: Verify modules
        run: |
          go mod download
          go mod verify
          test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - name: Test
        env:
          OBJECTSHARE_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=objectshare password=objectshare-ci-only dbname=objectshare_test sslmode=disable
        run: |
          node --version
          go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Install browser for frontend tests
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Exercise frontend against disposable application
        env:
          OBJECTSHARE_E2E_ALLOW_SETUP: "1"
          OBJECTSHARE_DB_HOST: 127.0.0.1
          OBJECTSHARE_DB_PORT: "5432"
          OBJECTSHARE_DB_USER: objectshare
          OBJECTSHARE_DB_PASSWORD: objectshare-ci-only
          OBJECTSHARE_DB_DATABASE: objectshare_test
          OBJECTSHARE_DB_SSLMODE: disable
        run: bash frontend/scripts/test-e2e.sh
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-browser-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan Go dependencies and call graph
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: "1.27"
          go-package: ./...

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: objectshare-ci-${{ github.run_id }}-${{ github.run_attempt }}
      OBJECTSHARE_IMAGE: objectshare:test
      OBJECTSHARE_PORT: 127.0.0.1:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: objectshare:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Configure disposable installation
        run: |
          for key in POSTGRES_PASSWORD OBJECTSHARE_JWT_SECRET OBJECTSHARE_SETTINGS_KEY; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Start fresh Compose installation
        run: |
          docker compose config --quiet
          docker compose up --no-build --wait --wait-timeout 120
      - name: Verify setup, storage, and restart
        env:
          OBJECTSHARE_SMOKE_ALLOW_SETUP: "1"
        run: node tests/install-smoke.cjs
      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100
      - name: Remove disposable installation
        if: always()
        run: docker compose down --volumes --remove-orphans
